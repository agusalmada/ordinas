<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Calendario de Contenido — growth.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --surface:#ffffff; --surface-2:#f7f7f2; --surface-3:#eeeee6;
  --line:#e2e2d8; --fg:#1d1f14; --fg-dim:#5c5f4f; --fg-faint:#93967f;
  --accent:#ddf26a; --accent-ink:#1d1f14; --accent-strong:#59680f; --accent-soft:#eef7cf;
  --ok:#2f7d3c; --ok-soft:#e3f3e3; --warn:#9a6b11; --warn-soft:#fbedcf;
  --bad:#b23b3b; --bad-soft:#fae3e3; --radius:18px; --radius-sm:12px;
  --info:#3461c1; --info-soft:#e3ebfa; --info-dot:#6fa3e8; --done:#147d6b; --done-soft:#d9f3ee;
  --lilac:#7c5cbf; --lilac-soft:#ede7f8; --lilac-dot:#8b3fd6;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);font-family:'Outfit',system-ui,sans-serif;min-height:100%;}
button{font-family:inherit;}
a{color:var(--accent-strong);}
.wrap{max-width:760px;margin:0 auto;padding:0 16px;}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);}
.topbar-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:14px;}
.brand{font-weight:800;font-size:18px;}
.brand .dot{color:var(--accent-strong);}
.subtitle{font-size:12px;color:var(--fg-faint);}
.spacer{flex:1;}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 0;}
.tab-btn{flex-shrink:0;border-radius:999px;padding:8px 16px;font-size:14px;font-weight:500;border:1px solid var(--line);background:transparent;color:var(--fg-dim);cursor:pointer;white-space:nowrap;}
.tab-btn.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.content{padding:20px 16px 60px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:var(--radius-sm);padding:9px 14px;font-size:14px;font-weight:500;border:none;cursor:pointer;background:var(--surface-3);color:var(--fg);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-accent{background:var(--accent);color:var(--accent-ink);}
.btn-ghost{background:transparent;color:var(--fg-dim);}
.btn-danger{background:transparent;color:var(--bad);}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn-block{width:100%;}
.select,.input,.textarea{width:100%;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--surface-2);padding:9px 12px;font-size:14px;font-family:inherit;color:var(--fg);outline:none;}
.textarea{resize:vertical;}
.field{display:block;margin-bottom:12px;}
.field-label{font-size:12px;font-weight:500;color:var(--fg-dim);margin-bottom:4px;}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:500;}
.b-borrador{background:var(--surface-3);color:var(--fg-dim);}
.b-pendiente{background:var(--warn-soft);color:var(--warn);}
.b-aprobado{background:var(--ok-soft);color:var(--ok);}
.b-cambios{background:var(--bad-soft);color:var(--bad);}
.b-en-produccion{background:var(--lilac-soft);color:var(--lilac);}
.status-dot-lilac{background:var(--lilac-dot);}
.b-prod-pendiente{background:var(--info-soft);color:var(--info);}
.b-prod-listo{background:var(--done-soft);color:var(--done);font-weight:600;}
.b-reel{background:#f3e0fa;color:#8a2fb8;}
.b-post{background:#dbeafe;color:#1d5fc9;}
.b-carrusel{background:#ffe8cc;color:#b8630f;}
.b-story{background:#ffe0ea;color:#c23070;}
.msg{font-size:12px;margin-bottom:8px;}
.msg-err{color:var(--bad);}
.msg-ok{color:var(--ok);}
.card{border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px;margin-bottom:10px;}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;}
@media(min-width:640px){.overlay{align-items:center;}}
.sheet{width:100%;max-width:420px;max-height:92vh;overflow-y:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:20px;}
@media(min-width:640px){.sheet{border-radius:18px;}}
.sheet.wide{max-width:640px;}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:16px;}
.sheet-title{font-size:18px;font-weight:600;}
.x-btn{flex-shrink:0;width:32px;height:32px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg-dim);cursor:pointer;font-size:16px;}
.center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;}
.login-card{width:100%;max-width:380px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:20px;}
.seg{display:flex;border-radius:var(--radius-sm);background:var(--surface-3);padding:4px;margin-bottom:16px;font-size:14px;font-weight:500;}
.seg-btn{flex:1;border:none;background:transparent;border-radius:8px;padding:7px;color:var(--fg-dim);cursor:pointer;}
.seg-btn.active{background:var(--accent);color:var(--accent-ink);}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.wd{font-size:10px;text-align:center;color:var(--fg-faint);padding-bottom:4px;}
.day-cell{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:3px;cursor:pointer;background:var(--surface-2);font-size:13px;padding:5px;text-align:left;overflow:hidden;}
.day-cell.today{border-color:var(--accent-strong);}
.day-cell.empty{visibility:hidden;}
.day-num{font-size:11.5px;font-weight:600;color:var(--fg-dim);}
.day-cell.today .day-num{color:var(--accent-strong);}
.day-chips{display:flex;flex-direction:column;gap:2px;min-width:0;}
.chip-dot{display:block;font-size:9.5px;border-radius:5px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.chip-idea{background:var(--accent-soft);color:var(--accent-strong);}
.chip-event{background:var(--warn-soft);color:var(--warn);}
.chip-story{background:var(--ok-soft);color:var(--ok);}
.chip-more{font-size:9.5px;color:var(--fg-faint);}
.chip-dot[draggable="true"]{cursor:grab;}
.day-cell.drop-hover{outline:2px dashed var(--accent-strong);outline-offset:-2px;}
.img-thumb.img-drop-hover{outline:2px dashed var(--accent-strong);outline-offset:-2px;}
.status-dot{display:inline-block;width:6px;height:6px;border-radius:999px;margin-right:4px;flex-shrink:0;vertical-align:middle;}
.status-dot-ok{background:var(--ok);}
.status-dot-bad{background:var(--bad);}
.status-dot-info{background:var(--info-dot);}
.status-dot-done{background:var(--done);}
.status-dot-neutral{background:#9a9a90;}
.dots{display:flex;gap:2px;}
.dot{width:5px;height:5px;border-radius:999px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;}
.grid-slot{position:relative;aspect-ratio:1;background:var(--surface-3);overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;color:var(--fg-faint);padding:4px;cursor:pointer;border:none;}
.grid-slot img{width:100%;height:100%;object-fit:cover;}
.hl-row{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;}
.hl-item{display:flex;flex-direction:column;align-items:center;gap:4px;width:64px;flex-shrink:0;cursor:pointer;background:none;border:none;}
.hl-circle{width:58px;height:58px;border-radius:999px;border:1px solid var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:18px;}
.hl-circle img{width:100%;height:100%;object-fit:cover;}
.hl-label{font-size:10px;color:var(--fg-dim);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.profile-row{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.avatar{width:64px;height:64px;border-radius:999px;overflow:hidden;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;flex-shrink:0;border:none;padding:0;cursor:pointer;}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:999px;display:block;}
.trash-row,.log-row{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;}
.story-progress{display:flex;gap:3px;margin-bottom:10px;}
.story-progress span{flex:1;height:3px;border-radius:2px;background:var(--line);}
.story-progress span.on{background:var(--accent-strong);}
.story-img-wrap{position:relative;border-radius:var(--radius-sm);overflow:hidden;background:var(--surface-3);margin-bottom:14px;max-height:60vh;display:flex;align-items:center;justify-content:center;}
.story-img-wrap img{max-width:100%;max-height:60vh;object-fit:contain;}
.story-tap{position:absolute;top:0;bottom:0;width:50%;background:transparent;border:none;cursor:pointer;}
.story-zoom-btn{position:absolute;top:8px;right:8px;z-index:2;background:rgba(0,0,0,.45);color:#fff;border:none;border-radius:999px;width:30px;height:30px;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.story-zoom-overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:100;display:flex;align-items:center;justify-content:center;cursor:zoom-out;padding:24px;}
.story-zoom-overlay img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;}
.hl-circle-wrap{position:relative;display:inline-flex;}
.hl-dot{position:absolute;bottom:0;right:0;width:14px;height:14px;border-radius:999px;border:2px solid var(--surface);}
.loading-text{color:var(--fg-faint);font-size:14px;text-align:center;padding:60px 0;}
.list-item{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;}
.list-item .grow{flex:1;min-width:0;}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row-gap{display:flex;gap:8px;flex-wrap:wrap;}
.creative-card{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;}
.creative-card img,.creative-card video{width:100%;height:110px;object-fit:cover;background:#000;}
.comment{border-top:1px solid var(--line);padding-top:8px;margin-top:8px;font-size:13px;}
.comment b{font-size:12px;}
.comment .when{font-size:10px;color:var(--fg-faint);}
.cc-wrap{display:flex;flex-direction:column;}
.cc-side .comment:first-child{border-top:none;padding-top:0;margin-top:0;}
@media(min-width:720px){
  .cc-wrap{flex-direction:row;align-items:flex-start;gap:16px;}
  .cc-main{flex:1;min-width:0;}
  .cc-side{width:220px;flex-shrink:0;border-left:1px solid var(--line);padding-left:14px;display:flex;flex-direction:column;max-height:420px;}
  .cc-side .cc-list{overflow-y:auto;flex:1;min-height:0;}
  .cc-side .cc-input-row{margin-top:8px;flex-shrink:0;}
}
.file-label{font-size:12px;color:var(--accent-strong);cursor:pointer;}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
"use strict";

/* ===================== CONFIG ===================== */
const SUPABASE_CONFIG = {
  url: "https://vjanklrivsiqingaddbd.supabase.co",
  anonKey: "sb_publishable_WMDsRd3kqmZRiE-kjqx6PQ_MFPCR8hs",
};
const sb = supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);

/* ===================== CONSTANTS ===================== */
const MONTHS = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function monthYearLabel(dateStr){
  if (!dateStr) return "";
  const parts = dateStr.split("-");
  const y = parts[0], m = parts[1];
  if (!y || !m) return "";
  const name = MONTHS[parseInt(m,10)-1];
  if (!name) return "";
  return name.charAt(0).toUpperCase()+name.slice(1)+" "+y;
}
function campMonthLabel(c){
  const s = monthYearLabel(c.start_date);
  const e = monthYearLabel(c.end_date);
  if (s && e && s !== e) return s+" → "+e;
  return s || e || "";
}
const WEEKDAYS_SHORT = ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
const EVENT_TYPES = ["Evento","Curso","Producción"];
const FORMATS = ["Reel","Post","Carrusel","Story"];
const FEED_FORMATS = FORMATS.filter(f=>f!=="Story");
const FORMAT_CLASS = {Reel:"b-reel",Post:"b-post",Carrusel:"b-carrusel",Story:"b-story"};
const STATUS_DOT_CLASS = {aprobado:"status-dot-ok",cambios:"status-dot-bad",pendiente:"status-dot-neutral",borrador:"status-dot-neutral"};
const STATUS_LABEL = {borrador:"Borrador",pendiente:"Pendiente",aprobado:"Aprobado",cambios:"Pide cambios"};
const STATUS_CLASS = {borrador:"b-borrador",pendiente:"b-pendiente",aprobado:"b-aprobado",cambios:"b-cambios"};
const PROD_STATUS_LABEL = {pendiente:"Para aprobar", aprobado:"✓ Listo para publicar", cambios:"Pide cambios"};
const PROD_STATUS_CLASS = {pendiente:"b-prod-pendiente", aprobado:"b-prod-listo", cambios:"b-cambios"};
function itemStageInfo(it){
  const extra = state.itemImages[it.id] || [];
  const hasProd = !!(it.media_url || it.story_media_url || it.final_copy || extra.length);
  if (it.status !== "aprobado"){
    return {phase:"idea", hasProd, label: STATUS_LABEL[it.status], badgeClass: STATUS_CLASS[it.status], dotClass: STATUS_DOT_CLASS[it.status] || "status-dot-neutral"};
  }
  if (!hasProd){
    return {phase:"waiting", hasProd, label:"En producción", badgeClass:"b-en-produccion", dotClass:"status-dot-lilac"};
  }
  const ps = it.prod_status || "pendiente";
  return {phase:"prod", hasProd, label: PROD_STATUS_LABEL[ps], badgeClass: PROD_STATUS_CLASS[ps], dotClass: ps==="cambios"?"status-dot-bad":ps==="aprobado"?"status-dot-done":"status-dot-info"};
}
const BRAND_CATEGORIES = ["Plan de marketing","Brief","Logos","Manual de marca","Stock (imágenes y videos)"];
const META_CAMPAIGN_TYPES = ["Mensajes","Interacción"];
const GOOGLE_CAMPAIGN_TYPES = ["Search","Performance Max"];
const ACTION_LABEL = {create:"creó",update:"actualizó",delete:"eliminó",restore:"restauró",purge:"eliminó para siempre"};
const TRASH_TABLES = [
  {table:"calendar_items", entityType:"Idea / evento", storageCol:"media_path"},
  {table:"item_images", entityType:"Imagen de carrusel", storageCol:"image_path"},
  {table:"highlights", entityType:"Destacada", storageCol:"image_path"},
  {table:"highlight_stories", entityType:"Historia de destacada", storageCol:"image_path"},
  {table:"brand_files", entityType:"Archivo de marca", storageCol:"path"},
  {table:"ad_campaigns", entityType:"Campaña", storageCol:null},
  {table:"ad_creatives", entityType:"Pieza publicitaria", storageCol:"media_path"},
];

/* ===================== HELPERS ===================== */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function monthKey(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; }
function dateKey(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function fmtWhen(iso){
  if(!iso) return "";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return "";
  return `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}
function safeFileName(name){ return name.replace(/[^a-zA-Z0-9._-]+/g,"-").slice(-80); }
function commentsPanelHTML(comments, {inputId, action, dataId, placeholder}){
  return `<div class="cc-side">
    <div class="cc-list">
      ${comments.length ? comments.map(c => `<div class="comment"><b>${esc(c.author_name||"Alguien")}</b> <span class="when">${fmtWhen(c.created_at)}</span><div>${esc(c.text)}</div></div>`).join("") : `<div style="font-size:12px;color:var(--fg-faint);">Sin comentarios todavía</div>`}
    </div>
    <div class="cc-input-row">
      <textarea class="textarea" rows="3" style="margin-bottom:6px;" placeholder="${esc(placeholder)}" id="${inputId}"></textarea>
      <button class="btn btn-accent btn-sm btn-block" data-action="${action}" data-id="${dataId}">Enviar</button>
    </div>
  </div>`;
}
function startOfMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
function daysInMonth(d){ return new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); }
function mondayIndex(jsDay){ return (jsDay+6)%7; }
function qs(id){ return document.getElementById(id); }
function val(id){ const el=qs(id); return el ? el.value : ""; }
function checked(id){ const el=qs(id); return el ? el.checked : false; }
function file0(id){ const el=qs(id); return el && el.files && el.files[0] ? el.files[0] : null; }
function filesAll(id){ const el=qs(id); return el && el.files ? Array.from(el.files) : []; }

/* ===================== STATE ===================== */
const state = {
  profile: null,
  identityRole: "agency",
  loading: true,
  clients: [],
  clientId: null,
  tab: "cal",
  month: startOfMonth(new Date()),
  calendarItems: [],
  comments: {},
  highlightComments: {},
  itemImages: {},
  highlights: [],
  highlightStories: [],
  brandFiles: [],
  adCampaigns: [],
  adCreatives: [],
  adsPlatform: "meta",
  trash: [],
  activityLog: [],
  historyTab: "trash",
  sheet: null,
  sheetMsg: "",
  sheetErr: false,
  sheetBusy: false,
  prodSlideIdx: {},
};
const channels = {};
function removeChannel(key){ if(channels[key]){ sb.removeChannel(channels[key]); delete channels[key]; } }
function removeTabChannels(){ ["cal","ig","brand","ads"].forEach(removeChannel); }

/* ===================== DATA HELPERS (shared) ===================== */
async function logActivity(opts){
  await sb.from("activity_log").insert({
    client_id: opts.clientId, action: opts.action, entity_type: opts.entityType,
    label: opts.label||"", by_name: opts.byName, collection: opts.collection||null, doc_id: opts.docId||null,
  });
}
async function trashRow(table, id, byName, opts){
  const {data, error} = await sb.from(table).update({deleted_at:new Date().toISOString(), deleted_by:byName}).eq("id", id).select("id");
  if (error) throw error;
  if (!data || data.length === 0) throw new Error("Supabase no dejó borrar (revisá que exista una política de UPDATE para la tabla \""+table+"\").");
  await logActivity({clientId:opts.clientId, action:"delete", entityType:opts.entityType, label:opts.label, byName, collection:table, docId:id});
}
async function restoreRow(table, id, byName, opts){
  const {data, error} = await sb.from(table).update({deleted_at:null, deleted_by:null}).eq("id", id).select("id");
  if (error) throw error;
  if (!data || data.length === 0) throw new Error("Supabase no dejó restaurar (revisá que exista una política de UPDATE para la tabla \""+table+"\").");
  await logActivity({clientId:opts.clientId, action:"restore", entityType:opts.entityType, label:opts.label, byName, collection:table, docId:id});
}
async function purgeRow(table, id, byName, opts){
  if (opts.storagePath) await sb.storage.from("media").remove([opts.storagePath]);
  await sb.from(table).delete().eq("id", id);
  await logActivity({clientId:opts.clientId, action:"purge", entityType:opts.entityType, label:opts.label, byName, collection:table, docId:id});
}
async function setApprovalStatus(table, id, status, column){
  column = column || "status";
  const {data, error} = await sb.from(table).update({[column]: status}).eq("id", id).select("id");
  if (error) throw error;
  if (!data || data.length === 0) throw new Error("Supabase no dejó guardar el cambio (revisá que exista una política de UPDATE para la tabla \""+table+"\").");
}
async function uploadMedia(path, file){
  const {error} = await sb.storage.from("media").upload(path, file, {upsert:true, contentType:file.type||undefined});
  if (error) throw error;
  const {data} = sb.storage.from("media").getPublicUrl(path);
  return {url:data.publicUrl, path};
}
function isAgency(){ return state.profile && state.profile.role === "agency"; }
function viewerName(){ return (state.profile && state.profile.name) || (isAgency()?"Agencia":"Cliente"); }
function currentClient(){ return state.clients.find(c => c.id === state.clientId) || null; }
function siblingClients(){
  const c = currentClient();
  if (!c || !c.group_key) return [];
  return state.clients.filter(x => x.group_key === c.group_key);
}

/* ===================== RENDER ROOT ===================== */
function render(){
  const app = qs("app");
  const prevSheetEl = app.querySelector(".sheet");
  const prevSheetScroll = prevSheetEl ? prevSheetEl.scrollTop : null;
  let html = "";
  if (state.loading){
    html = `<div class="center-screen"><div class="loading-text">Cargando…</div></div>`;
  } else if (!state.profile){
    html = renderIdentity();
  } else {
    html = renderShell();
  }
  app.innerHTML = html + (state.sheet ? renderSheetOverlay() : "") + (state.zoomImageUrl ? `<div class="story-zoom-overlay" data-action="img-zoom-close"><img src="${esc(state.zoomImageUrl)}"></div>` : "");
  if (prevSheetScroll !== null){
    const newSheetEl = app.querySelector(".sheet");
    if (newSheetEl) newSheetEl.scrollTop = prevSheetScroll;
  }
  attachDynamicListeners();
}

/* ===================== IDENTITY (sin login: nombre + rol, guardado en este navegador) ===================== */
const PROFILE_KEY = "calendario_profile_v1";
function loadProfileFromStorage(){
  try{ const raw = localStorage.getItem(PROFILE_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
function saveProfileToStorage(p){ try{ localStorage.setItem(PROFILE_KEY, JSON.stringify(p)); }catch(e){} }
function clearProfileStorage(){ try{ localStorage.removeItem(PROFILE_KEY); }catch(e){} }

async function init(){
  state.loading = true; render();
  await loadClients();
  subscribeClients();
  const p = loadProfileFromStorage();
  if (p && p.name && p.role && (p.role==="agency" || (p.role==="client" && p.clientId))){
    state.profile = p;
    state.clientId = p.role === "client" ? p.clientId : (state.clients[0] ? state.clients[0].id : null);
  }
  state.loading = false;
  if (state.clientId) await loadTabData();
  render();
}
function identitySubmit(){
  const name = val("id-name").trim();
  const role = state.identityRole || "agency";
  if (!name){ setSheetMsg("Poné tu nombre.", true); return; }
  let clientId = null;
  if (role === "client"){
    clientId = val("id-client");
    if (!clientId){ setSheetMsg("Elegí tu empresa.", true); return; }
  }
  const profile = {name, role, clientId};
  saveProfileToStorage(profile);
  state.profile = profile;
  state.clientId = role === "client" ? clientId : (state.clients[0] ? state.clients[0].id : null);
  state.sheetMsg = "";
  loadTabData().then(render);
  render();
}
async function switchUser(){
  clearProfileStorage();
  state.profile = null;
  state.clientId = null;
  removeTabChannels();
  render();
}

/* ===================== CLIENTS ===================== */
async function loadClients(){
  const {data} = await sb.from("clients").select("*").order("sort_order", {ascending:true, nullsFirst:false}).order("name");
  state.clients = data || [];
  render();
}
function subscribeClients(){
  removeChannel("clients");
  channels.clients = sb.channel("clients-list").on("postgres_changes", {event:"*", schema:"public", table:"clients"}, async()=>{ await loadClients(); }).subscribe();
}
async function setClient(id){
  state.clientId = id;
  if (state.profile && state.profile.role === "client"){
    state.profile = {...state.profile, clientId: id};
    saveProfileToStorage(state.profile);
  }
  await loadTabData();
  render();
}
async function setTab(tab){
  state.tab = tab;
  await loadTabData();
  render();
}
async function changeMonth(delta){
  state.month = new Date(state.month.getFullYear(), state.month.getMonth()+delta, 1);
  await loadTabData();
  render();
}
async function loadTabData(){
  if (!state.clientId) return;
  removeTabChannels();
  if (state.tab === "cal") await loadCalendar();
  else if (state.tab === "ig") { await loadHighlights(); await loadCalendar(); }
  else if (state.tab === "brand") await loadBrand();
  else if (state.tab === "ads") await loadAds();
}

/* ===================== CALENDAR ===================== */
async function loadCalendar(){
  const {data:items} = await sb.from("calendar_items").select("*").eq("client_id", state.clientId).is("deleted_at", null).order("date");
  state.calendarItems = items || [];
  const ids = state.calendarItems.map(i=>i.id);
  let comments = [];
  let imgs = [];
  if (ids.length){
    const [{data:cm},{data:im}] = await Promise.all([
      sb.from("comments").select("*").in("item_id", ids).order("created_at"),
      sb.from("item_images").select("*").in("item_id", ids).is("deleted_at", null).order("order"),
    ]);
    comments = cm||[]; imgs = im||[];
  }
  const map = {}; comments.forEach(c => { (map[c.item_id] ||= []).push(c); });
  state.comments = map;
  const imgMap = {}; imgs.forEach(x => { (imgMap[x.item_id] ||= []).push(x); });
  state.itemImages = imgMap;
  removeChannel("cal");
  channels.cal = sb.channel("cal-"+state.clientId)
    .on("postgres_changes", {event:"*", schema:"public", table:"calendar_items", filter:`client_id=eq.${state.clientId}`}, async()=>{ await loadCalendar(); render(); })
    .on("postgres_changes", {event:"*", schema:"public", table:"comments", filter:`client_id=eq.${state.clientId}`}, async()=>{ await loadCalendar(); render(); })
    .on("postgres_changes", {event:"*", schema:"public", table:"item_images", filter:`client_id=eq.${state.clientId}`}, async()=>{ await loadCalendar(); render(); })
    .subscribe();
}
async function addItemImages(itemId){
  const el = qs("item-carousel-file-"+itemId);
  const files = el && el.files ? Array.from(el.files) : [];
  if (!files.length) return;
  setSheetBusy(true);
  try{
    let nextOrder = (state.itemImages[itemId]||[]).length;
    for (const f of files){
      const {url,path} = await uploadMedia(`calendar-media/${state.clientId}/${Date.now()}-${safeFileName(f.name)}`, f);
      const {error} = await sb.from("item_images").insert({item_id:itemId, client_id:state.clientId, order:nextOrder, image_url:url, image_path:path});
      if (error) throw error;
      nextOrder++;
    }
    const it = state.calendarItems.find(x=>x.id===itemId);
    await logActivity({clientId:state.clientId, action:"create", entityType:"Idea / evento", label:`${it?it.title:""} (+${files.length} imagen${files.length>1?"es":""} de carrusel)`, byName:viewerName()});
    if (el) el.value = "";
    render();
  }catch(e){ alert("No se pudo subir: "+e.message); }
  finally{ setSheetBusy(false); }
}
async function deleteItemImage(imgId){
  try{
    await trashRow("item_images", imgId, viewerName(), {clientId:state.clientId, entityType:"Idea / evento", label:"Imagen de carrusel"});
    for (const itemId in state.itemImages){
      const list = state.itemImages[itemId];
      const idx = list.findIndex(im=>im.id===imgId);
      if (idx !== -1){ list.splice(idx,1); break; }
    }
    render();
  }catch(e){ alert("No se pudo borrar la imagen: "+e.message); }
}
async function reorderItemImage(itemId, draggedId, targetId){
  if (!draggedId || !targetId || draggedId === targetId) return;
  const list = (state.itemImages[itemId] || []).slice();
  const fromIdx = list.findIndex(im=>im.id===draggedId);
  const toIdx = list.findIndex(im=>im.id===targetId);
  if (fromIdx===-1 || toIdx===-1) return;
  const [moved] = list.splice(fromIdx,1);
  list.splice(toIdx,0,moved);
  state.itemImages[itemId] = list;
  render();
  try{
    for (let i=0;i<list.length;i++){
      if (list[i].order !== i){
        const {data, error} = await sb.from("item_images").update({order:i}).eq("id", list[i].id).select("id");
        if (error) throw error;
        if (!data || data.length===0) throw new Error('Supabase no dejó reordenar (revisá el permiso de UPDATE para "item_images").');
        list[i].order = i;
      }
    }
  }catch(e){
    alert("No se pudo reordenar: "+e.message);
    await loadCalendar(); render();
  }
}
function renderCalendarTab(){
  const y = state.month.getFullYear(), m = state.month.getMonth();
  const lead = mondayIndex(startOfMonth(state.month).getDay());
  const total = daysInMonth(state.month);
  const todayKey = dateKey(new Date());
  let cells = "";
  for (let i=0;i<lead;i++) cells += `<div class="day-cell empty"></div>`;
  for (let d=1; d<=total; d++){
    const key = `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const items = state.calendarItems.filter(it => it.date === key);
    const shown = items.slice(0,2);
    let chipsHtml = shown.map(it => `<span class="chip-dot ${it.kind==='event'?'chip-event':it.kind==='story'?'chip-story':'chip-idea'}"${isAgency()?` draggable="true" data-drag-id="${it.id}"`:""}><span class="status-dot ${itemStageInfo(it).dotClass}"></span>${esc(it.title||(it.kind==='event'?'Evento':it.kind==='story'?'Historia':'Idea'))}</span>`).join("");
    if (items.length > 2) chipsHtml += `<span class="chip-more">+${items.length-2} más</span>`;
    cells += `<button class="day-cell${key===todayKey?' today':''}" data-action="open-day" data-date="${key}" data-drop-date="${key}"><span class="day-num">${d}</span><span class="day-chips">${chipsHtml}</span></button>`;
  }
  return `
    <div class="topbar-row" style="padding-top:0;margin-bottom:10px;">
      <button class="btn btn-ghost btn-sm" data-action="month-prev">‹</button>
      <div style="flex:1;text-align:center;font-weight:600;font-size:14px;text-transform:capitalize;">${MONTHS[m]} ${y}</div>
      <button class="btn btn-ghost btn-sm" data-action="month-next">›</button>
    </div>
    <div class="month-grid" style="margin-bottom:6px;">${WEEKDAYS_SHORT.map(w=>`<div class="wd">${w}</div>`).join("")}</div>
    <div class="month-grid">${cells}</div>

}

async function itemEditSave(id){
  const title = val("edit-item-title-"+id).trim();
  const format = val("edit-item-format-"+id);
  const description = val("edit-item-desc-"+id).trim();
  if (!title){ setSheetMsg("Poné un título.", true); return; }
  const it = state.calendarItems.find(i=>i.id===id);
  const reelLinkEl = qs("edit-item-reellink-"+id);
  setSheetBusy(true);
  try{
    const patch = {title, format, description, reel_link: format==="Reel" && reelLinkEl ? reelLinkEl.value.trim() : ""};
    const {data, error} = await sb.from("calendar_items").update(patch).eq("id", id).select("id");
    if (error) throw error;
    if (!data || data.length === 0) throw new Error('Supabase no dejó guardar el cambio (revisá que exista una política de UPDATE para la tabla "calendar_items").');
    if (it) Object.assign(it, patch);
    await logActivity({clientId:state.clientId, action:"update", entityType: it&&it.kind==="event"?"Fecha especial":"Idea de contenido", label:title, byName:viewerName()});
    state.sheet.editingId = null;
    render();
  }catch(e){ setSheetMsg("No se pudo guardar: "+e.message, true); }
  finally{ setSheetBusy(false); }

async function itemProductionSave(id){
  const it = state.calendarItems.find(i=>i.id===id);
  const finalCopy = val("prod-copy-"+id).trim();
  const files = filesAll("prod-media-"+id);
  const storyFile = file0("prod-story-media-"+id);
  setSheetBusy(true);
  try{
    const patch = {final_copy: finalCopy};
    if (files.length){ const f=files[0]; const {url,path} = await uploadMedia(`calendar-media/${state.clientId}/${Date.now()}-${safeFileName(f.name)}`, f); patch.media_url=url; patch.media_path=path; patch.media_type = f.type&&f.type.indexOf("video/")===0 ? "video" : "image"; }
    if (storyFile){ const {url,path} = await uploadMedia(`calendar-media/${state.clientId}/${Date.now()}-${safeFileName(storyFile.name)}`, storyFile); patch.story_media_url=url; patch.story_media_path=path; patch.story_media_type = storyFile.type&&storyFile.type.indexOf("video/")===0 ? "video" : "image"; }
    const {data, error} = await sb.from("calendar_items").update(patch).eq("id", id).select("id");
    if (error) throw error;
    if (!data || data.length === 0) throw new Error('Supabase no dejó guardar el cambio (revisá que exista una política de UPDATE para la tabla "calendar_items", o que ya hayas agregado las columnas story_media_url/story_media_path/story_media_type).');
    if (it) Object.assign(it, patch);
    if (files.length > 1){
      let order = (state.itemImages[id]||[]).length;
      for (const f of files.slice(1)){
        const {url,path} = await uploadMedia(`calendar-media/${state.clientId}/${Date.now()}-${safeFileName(f.name)}`, f);
        const {data:imgRow, error:ie} = await sb.from("item_images").insert({item_id:id, client_id:state.clientId, order, image_url:url, image_path:path}).select().single();
        if (ie) throw ie;
        if (imgRow){ (state.itemImages[id] ||= []).push(imgRow); }
        order++;
      }
    }
    await logActivity({clientId:state.clientId, action:"update", entityType: it&&it.kind==="event"?"Fecha especial":"Idea de contenido", label:`${it?it.title:""} (producción)`, byName:viewerName()});
    const mEl = qs("prod-media-"+id); if (mEl) mEl.value="";
    const sEl = qs("prod-story-media-"+id); if (sEl) sEl.value="";
    if (state.sheet) state.sheet.editingProdId = null;
    setSheetMsg("Producción guardada.", false);
  }catch(e){ setSheetMsg("No se pudo guardar: "+e.message, true); }
  finally{ setSheetBusy(false); }
}

      const up = await uploadMedia(`ad-creatives/${state.clientId}/${campaignId}/${Date.now()}-${safeFileName(f.name)}`, f);
      media_url = up.url; media_path = up.path; media_type = f.type || null;
    }
    const {error} = await sb.from("ad_creatives").insert({campaign_id:campaignId, client_id:state.clientId, platform, media_url, media_path, media_type, description});
    if (error) throw error;
    await logActivity({clientId:state.clientId, action:"create", entityType:"Pieza publicitaria", label:description, byName:"Agencia"});
    state.creativeMode = "file";
    closeSheet();
  }catch(e){ setSheetMsg("No se pudo guardar: "+e.message, true); }
  finally{ setSheetBusy(false); }
}

/* ===================== HISTORY (trash + log), agency only ===================== */
async function loadHistory(){
  const results = await Promise.all(TRASH_TABLES.map(async ({table,entityType,storageCol})=>{
    const {data} = await sb.from(table).select("*").eq("client_id", state.clientId).not("deleted_at","is",null);
    return (data||[]).map(row=>({
      table, entityType, id:row.id,
      label: labelFor(table,row),
      deleted_at: row.deleted_at, deleted_by: row.deleted_by||null,
      storagePath: storageCol ? (row[storageCol]||null) : null,
    }));
  }));
  state.trash = results.flat().sort((a,b)=> a.deleted_at < b.deleted_at ? 1 : -1);
  const {data:log} = await sb.from("activity_log").select("*").eq("client_id", state.clientId).order("ts",{ascending:false}).limit(300);
  state.activityLog = log||[];
  render();
}
function labelFor(table,row){
  switch(table){
    case "calendar_items": return row.title || "(sin título)";
    case "item_images": return "Imagen de carrusel";
    case "highlights": return row.label || "(sin nombre)";
    case "highlight_stories": return "Historia";
    case "brand_files": return row.label || row.file_name || "(archivo)";
    case "ad_campaigns": return row.name || "(sin nombre)";
    case "ad_creatives": return row.description || "(pieza)";
    default: return "";
  }
}
function renderHistorySheetBody(){
  if (state.historyTab === "trash"){
    if (!state.trash.length) return `<div class="loading-text">La papelera está vacía.</div>`;
    return state.trash.map(r=>`<div class="trash-row">
      <div class="grow">
        <div style="font-weight:500;font-size:14px;" class="truncate">${esc(r.label)}</div>
        <div style="font-size:11px;color:var(--fg-faint);">${esc(r.entityType)} · eliminado ${fmtWhen(r.deleted_at)}${r.deleted_by?" por "+esc(r.deleted_by):""}</div>

      <button class="btn btn-danger btn-sm" data-action="trash-purge" data-table="${r.table}" data-id="${r.id}">Borrar para siempre</button>

async function trashRestore(table,id){
  const r = state.trash.find(x=>x.table===table && x.id===id);
  if (!r) return;
  await restoreRow(table, id, "Agencia", {clientId:state.clientId, entityType:r.entityType, label:r.label});
}
async function trashPurge(table,id){
  const r = state.trash.find(x=>x.table===table && x.id===id);
  if (!r) return;
  if (!confirm(`¿Eliminar "${r.label}" para siempre? No se puede deshacer.`)) return;
  await purgeRow(table, id, "Agencia", {clientId:state.clientId, entityType:r.entityType, label:r.label, storagePath:r.storagePath});
}

    <button class="btn ${state.historyTab==='trash'?'btn-accent':''}" data-action="history-tab" data-tab="trash">Papelera ${state.trash.length?`(${state.trash.length})`:""}</button>
    <button class="btn ${state.historyTab==='log'?'btn-accent':''}" data-action="history-tab" data-tab="log">Actividad</button>
  </div>
  ${renderHistorySheetBody()}`;
}
function sheetAddClient(){
  return `${headHTML("Nuevo cliente")}
  <div class="field"><div class="field-label">Nombre del cliente</div><input class="input" id="newclient-name" placeholder="Ej: AdapHaus"></div>
  <div class="field"><div class="field-label">Usuario de Instagram</div><input class="input" id="newclient-handle" placeholder="@usuario"></div>
  ${sheetMsgHTML()}
  <button class="btn btn-accent btn-block" data-action="addclient-save" ${state.sheetBusy?"disabled":""}>Crear cliente</button>`;
}
async function addClientSave(){
  const name = val("newclient-name").trim();
  const handle = val("newclient-handle").trim().replace(/^@/,"");
  if (!name){ setSheetMsg("Poné un nombre.", true); return; }
  setSheetBusy(true);
  const {data, error} = await sb.from("clients").insert({name, handle}).select().single();
  setSheetBusy(false);
  if (error){ setSheetMsg("No se pudo crear: "+error.message, true); return; }
  closeSheet();
  await setClient(data.id);
}

/* ===================== SHELL / LOGIN / PENDING ===================== */

/* ===================== EVENT DELEGATION ===================== */
document.addEventListener("click", async (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const a = el.dataset.action;
  try{
  if (a === "overlay-close"){ if (e.target === el) closeSheet(); return; }
  if (a === "sheet-close"){ closeSheet(); return; }
  if (a === "identity-role"){ state.identityRole = el.dataset.role; state.sheetMsg=""; render(); return; }
  if (a === "identity-submit"){ identitySubmit(); return; }
  if (a === "switch-user"){ if (confirm("¿Cambiar de usuario? Vas a tener que elegir tu nombre y rol de nuevo.")) await switchUser(); return; }
  if (a === "set-tab"){ await setTab(el.dataset.tab); return; }
  if (a === "month-prev"){ await changeMonth(-1); return; }
  if (a === "month-next"){ await changeMonth(1); return; }
  if (a === "open-day"){ openSheet("day", {date: el.dataset.date}); return; }
  if (a === "new-item-kind"){ state.sheet.newKind = el.dataset.kind; state.sheetMsg=""; render(); return; }
  if (a === "new-item-save"){ await submitNewItem(el.dataset.date); return; }
  if (a === "item-status"){ await itemStatusChange(el.dataset.id, el.dataset.status); return; }
  if (a === "item-prod-status"){ await itemProdStatusChange(el.dataset.id, el.dataset.status); return; }
  if (a === "item-comment"){ await itemAddComment(el.dataset.id); return; }
  if (a === "item-edit"){ state.sheet.editingId = el.dataset.id; state.sheetMsg=""; render(); return; }
  if (a === "item-edit-save"){ await itemEditSave(el.dataset.id); return; }
  if (a === "item-edit-cancel"){ state.sheet.editingId = null; state.sheetMsg=""; render(); return; }
  if (a === "item-prod-edit"){ state.sheet.editingProdId = el.dataset.id; state.sheetMsg=""; render(); return; }
  if (a === "item-prod-edit-cancel"){ state.sheet.editingProdId = null; state.sheetMsg=""; render(); return; }
  if (a === "item-production-save"){ await itemProductionSave(el.dataset.id); return; }
  if (a === "item-delete"){ await itemDelete(el.dataset.id); return; }
  if (a === "edit-profile"){ openSheet("editProfile"); return; }
  if (a === "profile-save"){ await saveClientProfile(); return; }
  if (a === "highlight-new"){ openSheet("highlightEdit", {id:null}); return; }
  if (a === "highlight-edit-open"){ openSheet("highlightEdit", {id: el.dataset.id}); return; }
  if (a === "highlight-save"){ await saveHighlight(el.dataset.id || null); return; }
  if (a === "highlight-delete"){ await deleteHighlight(el.dataset.id); return; }
  if (a === "highlight-status"){ await (async()=>{ try{ await setApprovalStatus("highlights", el.dataset.id, el.dataset.status); const h=state.highlights.find(x=>x.id===el.dataset.id); await logActivity({clientId:state.clientId, action:"update", entityType:"Destacada", label:`${h?h.label:""} → ${STATUS_LABEL[el.dataset.status]}`, byName:viewerName()}); render(); }catch(err){ alert("No se pudo guardar: "+err.message); } })(); return; }
  if (a === "highlight-comment"){ await highlightAddComment(el.dataset.id); return; }
  if (a === "view-story"){ openSheet("storyViewer", {hid: el.dataset.hid, idx:0}); return; }
  if (a === "story-prev"){ const idx=Math.max(0, parseInt(el.dataset.idx)-1); state.sheet.idx=idx; render(); return; }
  if (a === "story-next"){ const max=parseInt(el.dataset.max); const idx=Math.min(max, parseInt(el.dataset.idx)+1); state.sheet.idx=idx; render(); return; }
  if (a === "story-zoom"){ state.sheet.zoomed = true; render(); return; }
  if (a === "story-zoom-close"){ state.sheet.zoomed = false; render(); return; }
  if (a === "img-zoom"){ state.zoomImageUrl = el.dataset.url; render(); return; }
  if (a === "img-zoom-close"){ state.zoomImageUrl = null; render(); return; }
  if (a === "story-add"){ await addStory(el.dataset.hid); return; }
  if (a === "story-delete"){ await deleteStory(el.dataset.sid, el.dataset.hid); return; }
  if (a === "feed-view"){ openSheet("feedView", {id: el.dataset.id}); return; }
  if (a === "feed-slide-prev"){ const idx=Math.max(0, parseInt(el.dataset.idx)-1); state.sheet.idx=idx; render(); return; }
  if (a === "feed-slide-next"){ const max=parseInt(el.dataset.max); const idx=Math.min(max, parseInt(el.dataset.idx)+1); state.sheet.idx=idx; render(); return; }
  if (a === "item-image-add"){ await addItemImages(el.dataset.id); return; }
  if (a === "item-image-delete"){ await deleteItemImage(el.dataset.id); return; }
  if (a === "item-media-clear"){ await clearItemMedia(el.dataset.id, el.dataset.which); return; }
  if (a === "prod-slide-prev"){ const id=el.dataset.id; const max=parseInt(el.dataset.max); const cur=state.prodSlideIdx[id]||0; state.prodSlideIdx[id] = cur<=0 ? max : cur-1; render(); return; }
  if (a === "prod-slide-next"){ const id=el.dataset.id; const max=parseInt(el.dataset.max); const cur=state.prodSlideIdx[id]||0; state.prodSlideIdx[id] = cur>=max ? 0 : cur+1; render(); return; }
  if (a === "prod-slide-select"){ state.prodSlideIdx[el.dataset.id] = parseInt(el.dataset.idx); render(); return; }
  if (a === "brand-delete"){ await brandDelete(el.dataset.id); return; }
  if (a === "ads-platform"){ state.adsPlatform = el.dataset.platform; render(); return; }
  if (a === "campaign-new"){ openSheet("campaignEdit", {id:null, platform: state.adsPlatform}); return; }
  if (a === "campaign-view"){ openSheet("campaignView", {id: el.dataset.id}); return; }
  if (a === "campaign-edit-open"){ openSheet("campaignEdit", {id: el.dataset.id, platform: el.dataset.platform}); return; }
  if (a === "campaign-save"){ await saveCampaign(el.dataset.id || null, el.dataset.platform); return; }
  if (a === "campaign-delete"){ await deleteCampaign(el.dataset.id); return; }
  if (a === "creative-add-open"){ state.creativeMode = "file"; openSheet("creativeAdd", {cid: el.dataset.cid, platform: el.dataset.platform}); return; }
  if (a === "creative-mode"){ state.creativeMode = el.dataset.mode; state.sheetMsg=""; render(); return; }
  if (a === "creative-save"){ await addCreative(el.dataset.cid, el.dataset.platform); return; }
  if (a === "creative-delete"){ await deleteCreative(el.dataset.id); return; }
  if (a === "open-history"){ openSheet("history"); await loadHistory(); return; }
  if (a === "history-tab"){ state.historyTab = el.dataset.tab; render(); return; }
  if (a === "trash-restore"){ await trashRestore(el.dataset.table, el.dataset.id); return; }
  if (a === "trash-purge"){ await trashPurge(el.dataset.table, el.dataset.id); return; }
  if (a === "open-addclient"){ openSheet("addClient"); return; }
  if (a === "addclient-save"){ await addClientSave(); return; }
  }catch(err){ alert("No se pudo completar la acción: "+err.message); }
});
document.addEventListener("change", async (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const a = el.dataset.action;
  if (a === "select-client"){ await setClient(el.value); return; }
  if (a === "brand-upload"){ const f = el.files[0]; if (f) await brandUpload(el.dataset.cat, f); el.value=""; return; }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && state.sheet) closeSheet(); });
document.addEventListener("dragstart", (e) => {
  const imgEl = e.target.closest("[data-drag-img-id]");
  if (imgEl){
    e.dataTransfer.setData("application/x-img-id", imgEl.dataset.dragImgId);
    e.dataTransfer.setData("application/x-item-id", imgEl.dataset.dragItemId);
    e.dataTransfer.effectAllowed = "move";
    return;
  }
  const el = e.target.closest("[data-drag-id]");
  if (!el) return;
  e.dataTransfer.setData("text/plain", el.dataset.dragId);
  e.dataTransfer.effectAllowed = "move";
});
document.addEventListener("dragover", (e) => {
  const imgEl = e.target.closest("[data-drop-img-id]");
  if (imgEl){ e.preventDefault(); e.dataTransfer.dropEffect = "move"; imgEl.classList.add("img-drop-hover"); return; }
  const cell = e.target.closest(".day-cell[data-drop-date]");
  if (!cell) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = "move";
  cell.classList.add("drop-hover");
});
document.addEventListener("dragleave", (e) => {
  const imgEl = e.target.closest("[data-drop-img-id]");
  if (imgEl) imgEl.classList.remove("img-drop-hover");
  const cell = e.target.closest(".day-cell[data-drop-date]");
  if (cell) cell.classList.remove("drop-hover");
});
document.addEventListener("drop", async (e) => {
  const imgEl = e.target.closest("[data-drop-img-id]");
  if (imgEl){
    e.preventDefault();
    imgEl.classList.remove("img-drop-hover");
    const draggedId = e.dataTransfer.getData("application/x-img-id");
    const itemId = e.dataTransfer.getData("application/x-item-id");
    if (draggedId && itemId) await reorderItemImage(itemId, draggedId, imgEl.dataset.dropImgId);
    return;
  }
  const cell = e.target.closest(".day-cell[data-drop-date]");
  if (!cell) return;
  e.preventDefault();
  cell.classList.remove("drop-hover");
  const itemId = e.dataTransfer.getData("text/plain");
  if (!itemId) return;
  await moveItemToDate(itemId, cell.dataset.dropDate);
});
function attachDynamicListeners(){ /* reserved for future per-render wiring */ }

/* ===================== INIT ===================== */
init();
</script>
